<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boosted Communities • Dewrito.net</title>
  <link rel="stylesheet" href="site.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cosmic-bg"></div>
  <div class="starfield"></div>
  <header class="nav">
    <div class="logo">
      <img src="logo-compass.jpg" alt="" class="logo-mark-img">
      <span class="logo-text">dewrito.net</span>
    </div>
    <nav>
      <a href="index.html">HOME</a>
      <a href="community.html">COMMUNITY</a>
      <a href="register.html">REGISTER</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <a href="register.html" class="btn-get-started">GET STARTED ✦</a>
  </header>
  <main style="padding: 2rem; max-width: 1100px; margin: 0 auto;">
    <h1 style="font-family:Orbitron,sans-serif;color:#f0c14b;text-align:center;margin:2rem 0;">Boosted Communities</h1>
    <p style="text-align:center;margin-bottom:2rem;">Explore and boost Matrix & Fluxer communities. 25 XLM = 1 month visibility.</p>
    <div class="cards" id="allCards"></div>
    <p style="text-align:center;margin-top:2rem;"><a href="index.html" class="btn primary">← Back to Home</a></p>
  </main>
  <script>
    // Placeholder cards matching style
    const items = [
      {name:'POLITICS', room:'#politics:dewrito.net', img:'bzF4l.jpg'},
      {name:'US POLITICS', room:'#us-politics:dewrito.net', img:'NSbn6.jpg'},
      {name:'BARK!', room:'#bark:dewrito.net', img:'THc71.jpg'},
      {name:'OTAKU', room:'#otaku:dewrito.net', img:'fantasy-forest.jpg'},
      {name:'GAMES', room:'#games:dewrito.net', img:'tech-city.jpg'}
    ];
    document.getElementById('allCards').innerHTML = items.map(i => `
      <a href="https://matrix.to/#/${i.room}" class="card" target="_blank">
        <img src="${i.img}" alt="${i.name}">
        <img src="card-frame.jpg" class="card-frame" alt="">
        <div class="card-overlay"><h3>${i.name}</h3><p>${i.room}</p></div>
      </a>`).join('');
  </script>
</body>
</html>
